        * {
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            background: #002b5c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        label {
            margin-top: 12px;
            font-weight: 600;
            display: block;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            margin-top: 6px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #0d47a1;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
        }

        button:hover {
            background: #1565c0;
        }

        .success {
            color: green;
            text-align: center;
            margin-top: 10px;
        }

        .error {
            color: red;
            text-align: center;
            margin-top: 10px;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .btn-loading {
            background-color: #9e9e9e !important;
        }

        .btn-success {
            background-color: #2e7d32 !important;
        }

        .btn-error {
            background-color: #c62828 !important;
        }
    </style>

    <script>
        const scriptURL =
            "https://script.google.com/macros/s/AKfycbwZFnric7vrvKfvEtPlZMyHlohvAOzI4IPSUIXzWAJN39L7cE4Hjzo7bPMir9On-AI_/exec";

        const form = document.getElementById("registrationForm");
        const submitBtn = document.getElementById("submitBtn");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.textContent = "Submitting...";
            submitBtn.classList.add("btn-loading");

            document.getElementById("successMsg").textContent = "";
            document.getElementById("errorMsg").textContent = "";

            const data = {
                name: document.getElementById("name").value,
                whatsapp: document.getElementById("whatsapp").value,
                email: document.getElementById("email").value,
                Country: document.getElementById("Country").value,
                qualification: document.getElementById("qualification").value,
                passingYear: document.getElementById("passingYear").value,
                college: document.getElementById("college").value,
                domain: document.getElementById("domain").value,
                startDate: document.getElementById("startDate").value,
                tenure: document.getElementById("tenure").value,
                reference: document.getElementById("reference").value
            };

            try {
                const res = await fetch(scriptURL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: new URLSearchParams(data)
                });

                const result = await res.json();

                if (result.status === "success") {
                    submitBtn.classList.remove("btn-loading");
                    submitBtn.classList.add("btn-success");
                    submitBtn.textContent = "Submitted ✔";

                    document.getElementById("successMsg").textContent =
                        "Registration Submitted Successfully!";

                    form.reset();
                } else {
                    throw new Error("Server error");
                }

            } catch (err) {
                submitBtn.classList.remove("btn-loading");
                submitBtn.classList.add("btn-error");
                submitBtn.textContent = "Try Again";

                submitBtn.disabled = false;

                document.getElementById("errorMsg").textContent =
                    "Submission failed. Please try again.";
            }
        });
    </script>

    <script>
        const countryInput = document.querySelector('input[list="countryList"]');
        const countryOptions = Array.from(
            document.getElementById('countryList').options
        );

        function isCountrySelected() {
            return countryOptions.some(
                option => option.value === countryInput.value
            );
        }

        countryInput.addEventListener("change", () => {
            if (isCountrySelected()) {
                console.log("Country selected:", countryInput.value);
                // ✅ Country is selected
            } else {
                console.log("Invalid country entered");
                alert("select proper country type")
                // ❌ Not selected from dropdown
            }
        });
    </script>
