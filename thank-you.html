    <style>
      .thank-you-section {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #f0f4f8 0%, #d7e3fc 100%);
        position: relative;
        overflow: hidden;
      }

      .thank-you-section::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: radial-gradient(#e9ecef 1px, transparent 1px);
        background-size: 20px 20px;
        opacity: 0.4;
      }

      .thank-you-card {
        background: white;
        border-radius: 20px;
        padding: 3rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        text-align: center;
        position: relative;
        z-index: 1;
        max-width: 600px;
        width: 100%;
      }

      .thank-you-icon {
        width: 100px;
        height: 100px;
        background: linear-gradient(135deg, var(--primary-color), #4361ee);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 2rem;
        color: white;
        font-size: 3rem;
        box-shadow: 0 10px 20px rgba(13, 110, 253, 0.2);
      }

      .thank-you-title {
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 1rem;
        color: var(--dark-color);
      }

      .thank-you-message {
        font-size: 1.1rem;
        color: #6c757d;
        margin-bottom: 2rem;
        line-height: 1.6;
      }

      .btn-home {
        padding: 0.8rem 2rem;
        font-weight: 600;
        border-radius: 50px;
        transition: all 0.3s ease;
      }

      .btn-home:hover {
        transform: translateY(-3px);
        box-shadow: 0 5px 15px rgba(13, 110, 253, 0.3);
      }
    </style>
  </head>
  <body>
    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <!-- Thank You Section -->
    <section class="thank-you-section">
      <div class="container">
        <div class="thank-you-card">
          <div class="thank-you-icon">
            <i class="fas fa-check"></i>
          </div>
          <h1 class="thank-you-title">Thank You!</h1>
          <p class="thank-you-message">
            Your message has been sent successfully. We appreciate you
            contacting us and will respond as soon as possible.
          </p>
          <a href="index.html" class="btn btn-primary btn-home">
            <i class="fas fa-home me-2"></i>Back to Home
          </a>
        </div>
      </div>
    </section>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Components JS -->
    <script src="js/components.js"></script>
    <!-- Custom JS -->
    <script src="js/script.js"></script>
    <script src="js/floating-button.js"></script>
  </body>
